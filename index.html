<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lite-Load — Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="brand">
    <img class="brand-logo" src="Logo_black.svg" alt="Lite-Load logo">
    <div class="brand-text">
      <h1 class="brand-name"><span class="lite">LITE</span><span class="dash">&nbsp;&ndash;&nbsp;</span><span class="load">LOAD</span></h1>
      <p class="brand-tag">LET&rsquo;S STACK THIS PAPER</p>
    </div>
  </header>
  <div class="brand-rule"></div>

  <main>
    <label class="dropzone" id="dropzone" for="fileInput" tabindex="0">
      <img class="truck" src="Truck.png" alt="">
      <h2>Drag And Drop Files Here</h2>
      <p class="dropzone-sub">PDF AND JPEG SUPPORTED</p>
      <input type="file" id="fileInput" class="visually-hidden" multiple accept=".pdf,.jpg,.jpeg">
    </label>

    <section class="filepanel empty" id="filepanel" aria-live="polite">
      <p class="empty-label" id="emptyLabel">NOTHING HERE YET</p>
    </section>

    <div class="actions">
      <button class="btn btn-primary" id="convertBtn" disabled>Begin Document Conversion</button>
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
    </div>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
